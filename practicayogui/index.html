  .player{

  .sound{
    display:flex;align-items:center;justify-content:center;gap:9px;
    text-align:center;color:var(--text);
    font-size:14.5px;font-weight:600;margin:16px auto 0;

  @keyframes soft{0%,100%{opacity:1}50%{opacity:.55}}

  /* ---------- Garantía (la revela Vturb en el minuto exacto) ---------- */
  .esconder{ display:none; }
  .guarantee{margin:26px auto 6px;text-align:center}
  .guarantee img{
    width:270px;max-width:72%;margin:0 auto;
    filter:drop-shadow(0 14px 34px rgba(0,0,0,.6));
    animation:rise .7s cubic-bezier(.16,.84,.44,1) both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(18px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  footer{position:relative;z-index:1;margin-top:46px;border-top:1px solid var(--line);padding:24px 18px 36px}
  footer .fwrap{max-width:var(--maxw);margin:0 auto;
    font-size:11.5px;color:var(--muted);line-height:1.7;text-align:center}

  @media (max-width:480px){
    .wrap{padding-top:34px}
    .sound{font-size:13.5px}
    .guarantee img{width:230px}
  }
  @media (prefers-reduced-motion:reduce){
    .guarantee img{animation:none}
    .sound .pulse{animation:none}
  }
