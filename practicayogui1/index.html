<script>
/* ===================================================================
   GARANTÍA PARA A/B TEST
   El A/B muestra 2 videos con tiempos distintos, así que NO usamos un
   tiempo fijo. Revelamos la garantía justo cuando aparece el BOTÓN DE
   COMPRA de Vturb (que programas por variante en el panel). Así se
   ajusta sola a cada video.
   Pega el enlace del checkout de ESTA oferta en CHECKOUT_HINT para que
   la detección sea exacta.
   =================================================================== */
(function(){
  var CHECKOUT_HINT = "pay.hotmart.com/J107271662T";   // enlace del checkout de esta oferta (detección precisa del botón)

  var box = document.getElementById('guarantee');
  if(!box) return;
  var done=false;
  function reveal(){ if(done) return; done=true; box.classList.remove('esconder'); }

  function isBtn(a){
    var r=a.getBoundingClientRect();
    return a.offsetParent!==null && r.width>60 && r.height>18;
  }
  function found(root){
    if(!root) return false;
    var links=root.querySelectorAll('a[href]');
    for(var i=0;i<links.length;i++){
      var a=links[i];
      if(CHECKOUT_HINT){
        if((a.href||'').indexOf(CHECKOUT_HINT)>-1 && isBtn(a)) return true;
      } else if(isBtn(a)){ return true; }
    }
    return false;
  }
  function check(){
    if(found(document.querySelector('.player'))){ reveal(); return true; }
    var sp=document.querySelector('vturb-smartplayer');
    if(sp && sp.shadowRoot && found(sp.shadowRoot)){ reveal(); return true; }
    return false;
  }

  var obs=new MutationObserver(check);
  obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class','href']});
  var iv=setInterval(function(){ if(check()||done) clearInterval(iv); }, 700);
})();
