<style>
  /* ============================================================
     PALETA  ·  edítala aquí si necesitas ajustar algún tono
     ============================================================ */
  :root{
    --ink:#0a0e1a;          /* azul/navy principal (tu color)   */
    --ink-soft:#1c2435;     /* navy un punto más claro          */
    --paper:#ffffff;        /* fondo                            */
    --surface:#f5f7fa;      /* gris clínico de apoyo            */
    --line:#e4e8ef;         /* hairline                         */
    --text:#11151f;         /* texto principal                  */
    --muted:#697586;        /* texto secundario                 */
    --live:#c0392b;         /* punto rojo "viendo ahora" (sutil)*/
    --maxw:700px;
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block}
  a{color:inherit}

  /* ---------- BARRA SUPERIOR / NAV ---------- */
  .topbar{height:4px;background:var(--ink)}
  .nav{
    background:var(--ink);
    color:#fff;
    height:54px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;
  }
  .nav .side{display:flex;align-items:center;gap:9px;min-width:64px}
  .nav .menu{font-size:13px;font-weight:600;letter-spacing:.06em}
  .nav .brand{display:flex;align-items:center;justify-content:center}
  .nav .brand img{height:38px;width:auto;display:block}
  .nav .ico{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
  .nav .right{justify-content:flex-end}

  /* ---------- CONTENEDOR ARTÍCULO ---------- */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:30px 20px 0}

  /* Bloque de credibilidad / dateline (no va en Vturb) */
  .byline{font-size:13.5px;color:var(--muted)}
  .byline .author{color:var(--ink);font-weight:700}
  .byline .row{margin-top:2px}
  .byline .updated{font-weight:600;color:#3a4252}
  .share{
    display:flex;gap:10px;align-items:center;
    margin:16px 0 6px;
  }
  .share a{
    width:34px;height:34px;border-radius:50%;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease,opacity .15s ease;
  }
  .share a:hover{transform:translateY(-2px);opacity:.9}
  .share svg{width:16px;height:16px;fill:#fff}
  .hr{height:1px;background:var(--line);margin:18px 0 22px}

  /* ---------- REPRODUCTOR VTURB ----------
     El titular y el botón al checkout viven DENTRO del reproductor. */
  .player{margin:0 auto;width:100%}

  /* ---------- VIENDO AHORA ---------- */
  .viewing{
    text-align:center;
    font-size:14.5px;color:var(--muted);
    margin:20px 0 4px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--live);
    box-shadow:0 0 0 0 rgba(192,57,43,.55);
    animation:pulse 1.8s infinite;
  }
  .viewing b{color:var(--ink);font-weight:700}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}
    70%{box-shadow:0 0 0 9px rgba(192,57,43,0)}
    100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}
  }

  /* ---------- GARANTÍA (la revela Vturb en el minuto exacto del video) ---------- */
  .esconder{ display:none; }      /* clase que Vturb muestra al llegar al tiempo */
  .guarantee{
    margin:26px auto 4px;
    text-align:center;
  }
  .guarantee img{
    width:280px;max-width:74%;margin:0 auto;
    filter:drop-shadow(0 14px 30px rgba(10,14,26,.18));
    animation:rise .7s cubic-bezier(.16,.84,.44,1) both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(18px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* ---------- FOOTER ---------- */
  footer{
    margin-top:40px;background:var(--surface);
    border-top:1px solid var(--line);
    padding:26px 20px 34px;
  }
  footer .fwrap{max-width:var(--maxw);margin:0 auto;
    font-size:11.5px;color:var(--muted);line-height:1.7;text-align:center}
  footer a{color:var(--ink);text-decoration:underline}

  :focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:3px}

  @media (max-width:480px){
    .nav .brand img{height:34px}
    .wrap{padding-top:22px}
    .guarantee img{width:230px}
  }
  @media (prefers-reduced-motion:reduce){
    .guarantee img{animation:none}
    .dot{animation:none}
    .share a{transition:none}
  }
</style>
</head>

<script>
/* ===================================================================

   (menú, lupa e iconos de redes son solo "adorno").
   NO afecta al botón de checkout, que vive dentro del reproductor.
   =================================================================== */
(function(){
  document.querySelectorAll('.nav, .share').forEach(function(zone){
    zone.addEventListener('click', function(e){
      var a = e.target.closest('a');
      if(a){ e.preventDefault(); }      // sin salto, sin navegación
    });
  });
})();

/* ===================================================================
   1) CONTADOR "VIENDO AHORA"  ·  fluctúa suave para dar realismo
   =================================================================== */
(function(){
  var el=document.getElementById('viewers');
  if(!el) return;
  var base=312, cur=base;
  setInterval(function(){
    cur += Math.floor(Math.random()*9)-4;          // ±4
    if(cur<base-40) cur=base-40;
    if(cur>base+55) cur=base+55;
    el.textContent=cur;
  }, 3200);
})();

/* ===================================================================
   2) GARANTÍA SINCRONIZADA CON EL VIDEO  ·  método oficial de Vturb
   El logo (clase .esconder) aparece SOLO cuando el video llega al
   tiempo indicado, leyendo el tiempo REAL del reproductor. Funciona
   aunque la persona pause el video, y queda alineado con tu botón.
   Para cambiar el momento:  39:47 = 39*60 + 47 = 2387 segundos.
   =================================================================== */
(function(){
  var delaySeconds = 39*60 + 47;   // ← 39:47 (cámbialo si mueves el precio)
  var player = document.querySelector("vturb-smartplayer");
  if(!player || typeof player.addEventListener !== 'function') return;
  player.addEventListener("player:ready", function(){
    try {
      player.displayHiddenElements(delaySeconds, [".esconder"], { persist: true });
    } catch(e){}
  });
})();
</script>
