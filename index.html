  footer{position:relative;z-index:1;margin-top:46px;border-top:1px solid var(--line);padding:24px 18px 36px}
  footer .fwrap{max-width:var(--maxw);margin:0 auto;

    .sound{font-size:13.5px}
    .guarantee img{width:230px}
  }
  @media (prefers-reduced-motion:reduce){
    .guarantee img{animation:none}

  }
